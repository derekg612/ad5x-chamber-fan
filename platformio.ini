; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main_s3touch.cpp> -<main_c3oled.cpp> -<esp_lcd_touch_axs5106l.cpp>
lib_deps =
	ESP32Async/AsyncTCP@^3.3.2
	ESP32Async/ESPAsyncWebServer@^3.6.0
	alanswx/ESPAsyncWiFiManager@^0.31
	olikraus/U8g2@^2.28.8

; Waveshare ESP32-S3-Touch-LCD-1.47: same fan/thermistor control, but the
; OLED and physical buttons are replaced by the board's built-in 172x320
; capacitive touchscreen. Build/upload with: pio run -e waveshare_esp32s3_touch_lcd_147
[env:waveshare_esp32s3_touch_lcd_147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3R8 module: 8 MB octal PSRAM, 16 MB quad-SPI flash.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<main.cpp> -<main_c3oled.cpp>
lib_deps =
	ESP32Async/AsyncTCP@^3.3.2
	ESP32Async/ESPAsyncWebServer@^3.6.0
	alanswx/ESPAsyncWiFiManager@^0.31
	moononournation/GFX Library for Arduino@^1.4.9

; Generic ESP32-C3 board with an onboard 0.42" 72x40 SSD1306 OLED
; (https://www.espboards.dev/esp32/esp32-c3-oled-042/). Same PWM fan control
; as the touchscreen build, with two external momentary buttons on IO1/IO4.
; Build/upload with: pio run -e esp32_c3_oled_042
[env:esp32_c3_oled_042]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Serial over the board's native USB rather than UART0, which frees IO20 for
; the fan and is the only serial port this board's USB-C connector reaches.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<main.cpp> -<main_s3touch.cpp> -<esp_lcd_touch_axs5106l.cpp>
lib_deps =
	ESP32Async/AsyncTCP@^3.3.2
	ESP32Async/ESPAsyncWebServer@^3.6.0
	alanswx/ESPAsyncWiFiManager@^0.31
	olikraus/U8g2@^2.28.8
